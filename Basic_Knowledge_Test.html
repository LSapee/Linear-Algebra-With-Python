<title>나의 수학 출발점 · 기초 지식 점검</title>
<style>
:root{color-scheme:light;--ink:#243d36;--muted:#63736d;--green:#27664e;--line:#dae3dc;--paper:#fffefb;--bg:#f0f3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:760px;margin:64px auto;padding:0 20px 64px}.brand{font-size:12px;letter-spacing:.16em;font-weight:750;color:var(--green);margin-bottom:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:38px;box-shadow:0 16px 60px #243d3608}h1{font-size:32px;line-height:1.4;letter-spacing:-.04em;margin:12px 0 16px}h2{font-size:23px;line-height:1.55;margin:20px 0}h3{font-size:18px;margin:0 0 8px}p{margin:10px 0}.muted{color:var(--muted)}.eyebrow{font-size:13px;color:var(--green);font-weight:700}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.progress{height:6px;background:#e6ece6;border-radius:8px;margin:16px 0 28px;overflow:hidden}.progress span{display:block;background:var(--green);height:100%;transition:width .2s}.pill{display:inline-block;background:#e8f0e8;color:var(--green);border-radius:30px;padding:4px 12px;font-size:13px}.facts{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.formula{white-space:pre-wrap;background:#f3f5ef;border-radius:14px;padding:20px;font:21px/1.8 ui-monospace,monospace;margin:20px 0;text-align:center;overflow:auto}.label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}input[type=text]{width:100%;padding:16px;border:1.5px solid #a8b9ae;border-radius:12px;background:white;font:20px system-ui;color:var(--ink)}input:focus{outline:3px solid #b6d8c6;outline-offset:2px}button{cursor:pointer;font:inherit;border:0;border-radius:12px;padding:13px 20px;font-weight:650;background:var(--green);color:white}button:hover{filter:brightness(.94)}button:focus-visible,a:focus-visible{outline:3px solid #96bba7;outline-offset:4px}.secondary{background:#eaf0e9;color:var(--ink)}.ghost{background:transparent;color:var(--muted)}button:disabled{opacity:.45;cursor:default}fieldset{border:0;padding:0;margin:20px 0}legend{font-size:14px;font-weight:650;margin-bottom:8px}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}.option:has(input:checked){background:#eaf3eb;border-color:var(--green)}.option input{margin-top:7px;accent-color:var(--green)}.confidence{display:flex;gap:10px;flex-wrap:wrap}.confidence label{font-size:14px;background:#f1f4ee;padding:8px 12px;border-radius:10px;cursor:pointer}.confidence input{accent-color:var(--green)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.error{color:#9d3e2c;min-height:26px;font-size:14px}.note{border-left:3px solid #abc5b3;padding:0 0 0 16px;margin:24px 0;color:var(--muted);font-size:14px}.score{font-size:52px;font-weight:750;letter-spacing:-.05em}.score small{font-size:18px;font-weight:400;letter-spacing:0;color:var(--muted)}.section{border-top:1px solid var(--line);padding-top:26px;margin-top:28px}.domain{padding:18px 0;border-bottom:1px solid var(--line)}.bar{height:7px;background:#e6ece6;border-radius:5px;margin:10px 0}.bar span{display:block;height:100%;border-radius:5px;background:#57846c}.review{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.review summary{cursor:pointer;font-weight:650}.review p{font-size:14px}.review .formula{font-size:17px}a{color:var(--green);text-underline-offset:4px}.small{font-size:13px}.footer{margin-top:20px;text-align:center;color:var(--muted);font-size:12px}.hidden{display:none!important}@media(max-width:600px){main{margin:24px auto;padding:0 14px 40px}.card{padding:24px 20px;border-radius:20px}h1{font-size:27px}h2{font-size:21px}.actions button{flex:1}.formula{font-size:18px}}
@media print{body{background:white}main{max-width:none;margin:0;padding:0}.card{border:0;box-shadow:none;padding:0}.actions,.brand,.footer,summary::marker{display:none}.review{break-inside:avoid}details>*{display:block!important}}

<body>
<main>
 <div class="brand">FOUNDATIONS / 나의 수학 출발점</div>
 <section class="card" id="app" aria-live="polite"></section>
 <p class="footer">시간 제한 없음 · 서버 전송 없음 · 이 브라우저에 진행 상황 저장</p>
</main>
<script>
'use strict';
const domains = [
 {id:'arithmetic',name:'계산의 기초',chapter:'1–4번',tip:'계산 순서, 음수와 분수를 먼저 연습하세요.'},
 {id:'algebra',name:'문자와 방정식',chapter:'5–7번',tip:'문자를 빈칸으로 생각하고, 양쪽에 같은 계산을 해 보세요.'},
 {id:'powers',name:'제곱·루트·기호',chapter:'16–18번',tip:'제곱, 루트, 아래첨자는 각각 다른 약속입니다. 예제를 직접 써 보세요.'},
 {id:'vectors',name:'벡터와 전치',chapter:'8–12번, 15번',tip:'숫자 묶음을 종이에 가로·세로로 써 보고 행과 열을 세어 보세요.'},
 {id:'matrices',name:'행렬 계산',chapter:'13–14번',tip:'같은 자리끼리 더하기와, 행·열을 짝지어 곱하고 더하기를 구분하세요.'},
 {id:'python',name:'함수와 Python 읽기',chapter:'19–20번',tip:'수학의 기호와 Python의 기호를 나누어 익히세요.'}
];
const questions=[];
function number(d,text,formula,answer,explain,chapter){questions.push({d,text,formula,answer,explain,chapter,type:'number'});}
function choice(d,text,formula,options,answer,explain,chapter){questions.push({d,text,formula,options,answer,explain,chapter,type:'choice'});}
number('arithmetic','계산 결과를 적어 주세요.','2 + 3 × 4',14,'곱셈을 먼저 합니다. 3 × 4 = 12이고, 2 + 12 = 14입니다.','2');
number('arithmetic','괄호가 있는 계산입니다. 결과는 얼마인가요?','(2 + 3) × 4',20,'괄호 안을 먼저 계산합니다. 5 × 4 = 20입니다.','2');
number('arithmetic','빈칸에 들어갈 수를 적어 주세요.','3 − 7 = □',-4,'3에서 7을 빼면 0보다 4 작은 수인 -4입니다.','3');
number('arithmetic','두 음수를 곱하면 얼마인가요?','(−3) × (−2)',6,'음수와 음수의 곱은 양수입니다. 크기는 3 × 2 = 6입니다.','3');
number('arithmetic','분수를 소수 또는 나눗셈의 결과로 적어 주세요.','3 / 4',.75,'3/4는 3 ÷ 4입니다. 결과는 0.75입니다.','4');
choice('arithmetic','다음 중 계산할 수 없는 것은 무엇인가요?','',['0 ÷ 5','5 ÷ 1','5 ÷ 0','5 ÷ 5'],2,'0을 다른 수로 나누면 0이지만, 0으로 나누는 계산에는 값을 정하지 않습니다.','4');
choice('algebra','수학에서 다음 식은 무엇을 뜻하나요?','2 + 3 = 4 + 1',['왼쪽이 오른쪽보다 크다','양쪽의 값이 같다','왼쪽 계산만 한다','오른쪽은 항상 정답 숫자 하나여야 한다'],1,'등호는 양쪽 값이 같다는 뜻입니다. 양쪽이 모두 5입니다.','1');
number('algebra','x가 4일 때, 다음 식의 값은 얼마인가요?','3x + 2',14,'3x는 3 × x입니다. x에 4를 넣으면 12 + 2 = 14입니다.','5');
number('algebra','조건을 만족하는 x를 구해 주세요.','x + 4 = 11',7,'양쪽에서 4를 빼면 x = 7입니다. 7 + 4 = 11로 확인할 수 있습니다.','6');
number('algebra','조건을 만족하는 x를 구해 주세요.','2x + 3 = 11',4,'양쪽에서 3을 빼면 2x = 8입니다. 양쪽을 2로 나누면 x = 4입니다.','6');
choice('algebra','두 조건을 모두 만족하는 답은 무엇인가요?','x + y = 5\n2x + y = 8',['x = 2, y = 3','x = 3, y = 2','x = 4, y = 1','x = 1, y = 4'],1,'두 식의 차이는 x = 3입니다. 첫 식에 넣으면 y = 2입니다. 두 식에 모두 넣어 확인하세요.','7');
choice('algebra','다음 중 선형방정식은 무엇인가요?','',['x² + y = 5','xy = 6','2x + 3y = 8','x² = 9'],2,'선형방정식은 미지수에 정해진 수를 곱해 더하거나 뺀 형태입니다. 미지수의 제곱이나 미지수끼리의 곱은 포함하지 않습니다.','7');
number('powers','다음 값은 얼마인가요?','4²',16,'4의 제곱은 4 × 4 = 16입니다. 4 × 2가 아닙니다.','16');
number('powers','괄호와 부호를 보고 계산해 주세요.','(−3)²',9,'(-3)을 두 번 곱합니다. 음수 × 음수이므로 9입니다.','16');
number('powers','다음 값은 얼마인가요?','√25',5,'5 × 5 = 25입니다. 루트 기호는 제곱근 중 0 이상인 값을 가리키므로 √25 = 5입니다.','17');
choice('powers','이 방정식의 답을 빠짐없이 고르면 무엇인가요?','x² = 9',['x = 3만 가능','x = -3만 가능','x = 3 또는 x = -3','x = 9 또는 x = -9'],2,'3과 -3은 둘 다 제곱하면 9가 됩니다. √9의 값은 3이지만, 이 방정식의 해는 두 개입니다.','17');
choice('powers','이 묶음에서 x₂는 얼마인가요?','(x₁, x₂, x₃) = (29, 16, 3)',['29','16','32','3'],1,'아래첨자 2는 두 번째 값을 가리킵니다. 제곱이나 두 배라는 뜻이 아닙니다.','18');
choice('powers','다음 표기의 뜻으로 맞는 것은 무엇인가요?','√2 ≈ 1.414',['정확히 같다','왼쪽이 항상 작다','대략 같다','곱하라는 뜻이다'],2,'≈는 대략 같다는 뜻입니다. √2의 소수 표현을 1.414로 짧게 나타낸 것입니다.','17');
choice('vectors','x, y 순서로 답을 묶었습니다. 이 답의 뜻은 무엇인가요?','(3, 2)',['x = 2, y = 3','x = 3, y = 2','x와 y의 합이 32','x와 y는 모두 5'],1,'벡터는 순서가 있는 숫자 묶음입니다. 첫 번째 자리는 x, 두 번째 자리는 y입니다.','8');
choice('vectors','이 숫자 표의 크기는 무엇인가요?','[1  2  3]\n[4  5  6]',['3행 2열','2행 3열','1행 6열','6행 1열'],1,'가로줄이 2개이므로 2행, 세로줄이 3개이므로 3열입니다.','9');
choice('vectors','오른쪽 위 T가 붙으면 어떻게 쓰라는 뜻인가요?','(29, 16, 3)ᵀ',['각 숫자를 제곱한다','각 숫자에 T를 곱한다','29, 16, 3을 위에서 아래로 놓는다','3, 16, 29로 순서를 뒤집는다'],2,'T는 전치 표시입니다. 가로로 적은 벡터를 세로로 바꾸며 값과 순서는 유지됩니다.','11');
choice('vectors','이 행렬을 전치한 결과는 무엇인가요?','[1  2  3]\n[4  5  6]',['[1 4] / [2 5] / [3 6]','[3 2 1] / [6 5 4]','[1 2 3] / [4 5 6]','[6 5 4] / [3 2 1]'],0,'/는 다음 행을 뜻합니다. 첫 행 1, 2, 3이 첫 열이 되어 3행 2열이 됩니다.','12');
choice('vectors','3행 1열의 열벡터를 전치하면 크기는 어떻게 되나요?','',['3행 1열','1행 3열','3행 3열','1행 1열'],1,'전치는 행과 열을 바꾸므로 3행 1열이 1행 3열이 됩니다.','10–11');
choice('vectors','원점 (0, 0)에서 이 위치로 가려면 어떻게 이동하나요?','(−2, 3)',['오른쪽 2, 위 3','왼쪽 2, 위 3','왼쪽 3, 위 2','왼쪽 2, 아래 3'],1,'첫 값은 가로 위치, 둘째 값은 세로 위치입니다. 가로 음수는 왼쪽, 세로 양수는 위쪽입니다.','15');
choice('matrices','두 벡터의 합을 골라 주세요.','(1, 2) + (3, 4)',['(4, 6)','(3, 8)','(10)','(1, 2, 3, 4)'],0,'같은 자리끼리 더합니다. 첫째 값은 1+3=4, 둘째 값은 2+4=6입니다.','13');
choice('matrices','숫자 2를 벡터 전체에 곱하면 어떻게 되나요?','2 × (3, −1)',['(5, 1)','(6, -1)','(6, -2)','(3, -2)'],2,'모든 성분에 2를 곱합니다. 2×3=6, 2×(-1)=-2입니다.','13');
number('matrices','행렬과 벡터의 곱입니다. 결과의 첫째 값을 적어 주세요.','[1  2] [3]   [ □ ]\n[0  1] [4] = [ 4 ]',11,'첫째 행 [1, 2]와 열벡터 [3, 4]를 짝지어 곱한 뒤 더합니다. 1×3 + 2×4 = 11입니다.','14');
choice('matrices','두 행렬을 이 순서로 곱할 때 결과의 크기는 무엇인가요?','(2행 3열) × (3행 1열)',['곱할 수 없다','3행 3열','2행 1열','2행 3열'],2,'앞의 열 수 3과 뒤의 행 수 3이 같아 곱할 수 있습니다. 결과는 앞의 행 수 2와 뒤의 열 수 1을 가집니다.','14');
choice('matrices','다음 중 올바른 설명은 무엇인가요?','',['행렬은 순서를 바꿔 곱해도 항상 같다','행렬은 크기가 달라도 항상 더할 수 있다','행렬 곱셈은 같은 자리끼리만 곱한다','행렬 곱셈은 순서를 바꾸면 달라질 수 있다'],3,'행렬 곱셈은 순서에 영향을 받습니다. 덧셈은 행·열 크기가 각각 같아야 하고, 행렬 곱은 행과 열을 짝짓는 계산입니다.','13–14');
choice('matrices','이 행렬식 표현이 나타내는 연립방정식은 무엇인가요?','[1  1] [x]   [5]\n[2  1] [y] = [8]',['x + y = 5, 2x + y = 8','x + 2y = 5, x + y = 8','x + y = 8, 2x + y = 5','x = 5, y = 8'],0,'각 행이 방정식 하나에 해당합니다. 첫 행은 1x+1y=5, 둘째 행은 2x+1y=8입니다.','14');
number('python','f가 아래 계산 규칙일 때, f(3)은 얼마인가요?','f(x) = 2x + 1',7,'f(3)은 x 자리에 3을 넣는다는 뜻입니다. 2×3+1=7입니다.','19');
choice('python','Python에서 3의 제곱을 계산하는 코드는 무엇인가요?','',['3 * 2','3 ^ 2','3 ** 2','3 + 2'],2,'Python에서 거듭제곱은 **입니다. *는 곱셈이며 ^는 제곱 계산에 쓰지 않습니다.','20');
number('python','다음 Python 코드를 실행한 뒤 x에 저장된 값은 얼마인가요?','x = 3\nx = x + 1',4,'오른쪽에서 기존 x값 3에 1을 더한 뒤, 결과 4를 x에 새로 저장합니다.','20');
choice('python','Python에서 두 값이 같은지 비교하는 표시는 무엇인가요?','',['=','==','**','#'],1,'=는 저장, ==는 같은지 비교입니다. **는 거듭제곱, #은 주석 시작입니다.','20');
choice('python','A, B가 NumPy 배열일 때, 행렬 곱셈 코드는 무엇인가요?','',['A * B','A + B','A @ B','A == B'],2,'NumPy 배열의 행렬 곱은 @입니다. *는 원소별 곱셈으로 서로 다른 계산입니다.','20');
choice('python','NumPy에서 v는 아래처럼 만들었습니다. v.T의 크기는 무엇인가요?','v = np.array([[29], [16], [3]])',['3행 1열','1행 3열','3행 3열','전치는 할 수 없다'],1,'v는 3행 1열 배열입니다. .T로 전치하면 1행 3열이 됩니다.','20');

const KEY='basic-knowledge-diagnostic-v1';
const app=document.getElementById('app');
let state=null,storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.version===1&&Array.isArray(saved.answers)&&saved.answers.length===questions.length&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<questions.length&&saved.answers.every(a=>a===null||(a&&typeof a.value==='string'&&['sure','unsure','skip'].includes(a.confidence))))state=saved;}catch{storageOK=false;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageOK=false;}document.querySelector('.footer').textContent=storageOK?'시간 제한 없음 · 서버 전송 없음 · 이 브라우저에 진행 상황 저장':'시간 제한 없음 · 서버 전송 없음 · 저장 불가: 창을 닫으면 진행 상황이 사라질 수 있어요';}
function fresh(){state={version:1,index:0,answers:questions.map(()=>null),finished:false};persist();renderQuestion();}
function intro(){app.innerHTML=`<span class="eyebrow">기초 지식 진단</span><h1>어디부터 배우면 좋을지,<br>함께 확인해 볼까요?</h1><p class="muted">점수보다 중요한 건 막히는 지점을 찾는 일입니다. 작은 계산부터 벡터와 행렬까지, 한 번에 한 문제씩 풀어 보세요.</p><div class="facts"><span class="pill">36문제</span><span class="pill">6개 분야</span><span class="pill">약 20–35분 · 시간 제한 없음</span></div><p>가능하면 계산기나 자료 없이 풀어 주세요. 종이에 계산해도 좋습니다. 모르면 추측하는 대신 <strong>“모르겠어요”</strong>를 선택해 주세요.</p><p class="muted">정답을 고른 뒤 확신 정도도 알려 주세요. 해설은 모든 문제를 마친 뒤 보여 드립니다. 앞 문제로 돌아가 답을 바꿀 수 있습니다.</p><div class="note">이 검사는 Basic_Knowledge.md와 선형방정식 입문에 필요한 기초를 점검합니다. 모든 선형대수·확률 내용을 배울 준비를 보증하는 표준화 검사는 아닙니다.</div><div class="actions">${state?`<button id="resume">${state.finished?'이전 결과 보기':'이어서 풀기'}</button><button class="secondary" id="start">처음부터 풀기</button>`:'<button id="start">내 출발점 알아보기</button>'}</div><p class="small muted">다른 사람과 이 브라우저를 함께 쓴다면 “처음부터 풀기”를 선택해 주세요.</p>`;document.getElementById('start').onclick=()=>{if(!state||confirm('저장된 답을 지우고 처음부터 시작할까요?'))fresh();};if(state)document.getElementById('resume').onclick=()=>state.finished?renderResults():renderQuestion();}
function renderQuestion(){const q=questions[state.index],a=state.answers[state.index],d=domains.find(d=>d.id===q.d);app.innerHTML=`<div class="row"><span class="eyebrow">${esc(d.name)}</span><span class="small muted">${state.index+1} / ${questions.length}</span></div><div class="progress" role="progressbar" aria-label="문제 진행" aria-valuenow="${state.index+1}" aria-valuemin="0" aria-valuemax="${questions.length}"><span style="width:${(state.index+1)/questions.length*100}%"></span></div><form id="question-form"><h2 tabindex="-1" id="question-title">${esc(q.text)}</h2>${q.formula?`<pre class="formula">${esc(q.formula)}</pre>`:''}${q.type==='number'?`<label class="label" for="answer">정답</label><input id="answer" name="answer" type="text" autocomplete="off" placeholder="예: 7, -2, 0.5 또는 1/2" value="${a&&a.confidence!=='skip'?esc(a.value):''}"><p class="small muted">숫자만 적어 주세요. 소수와 분수, 전각 숫자도 입력할 수 있어요.</p>`:`<fieldset><legend>맞는 답 하나를 선택해 주세요.</legend><div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${a&&a.confidence!=='skip'&&a.value===String(i)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div></fieldset>`}<fieldset><legend>이 답을 얼마나 확신하나요?</legend><div class="confidence"><label><input type="radio" name="confidence" value="sure" ${a?.confidence==='sure'?'checked':''}> 알고 풀었어요</label><label><input type="radio" name="confidence" value="unsure" ${a?.confidence==='unsure'?'checked':''}> 헷갈려요 / 추측했어요</label></div></fieldset><p class="error" id="error" role="alert"></p><div class="actions"><button type="button" class="secondary" id="back" ${state.index===0?'disabled':''}>이전</button><button type="submit">${state.index===questions.length-1?'결과 확인':'다음 문제'}</button><button type="button" class="ghost" id="skip">모르겠어요</button></div></form><p class="small muted">답은 이 브라우저에 저장됩니다. ${q.type==='choice'&&q.formula.includes('[1  2  3]')?'선택지의 /는 다음 행으로 내려간다는 뜻입니다.':''}</p>`;
document.getElementById('question-title').focus();
const form=document.getElementById('question-form');
function draft(){const data=new FormData(form);state.answers[state.index]={value:String(data.get('answer')??''),confidence:String(data.get('confidence')??'unsure')};persist();}
form.onchange=draft;if(q.type==='number')document.getElementById('answer').oninput=draft;
document.getElementById('back').onclick=()=>{draft();state.index--;persist();renderQuestion();};
document.getElementById('skip').onclick=()=>{state.answers[state.index]={value:'',confidence:'skip'};advance();};
form.onsubmit=e=>{e.preventDefault();const data=new FormData(form),value=String(data.get('answer')??'').trim(),confidence=data.get('confidence');if(!value||(q.type==='number'&&parseNumber(value)===null)){document.getElementById('error').textContent='답을 입력하거나 선택해 주세요. 숫자 문제에는 숫자 또는 분수만 입력해 주세요.';return;}if(!confidence){document.getElementById('error').textContent='확신 정도도 선택해 주세요. 모르겠으면 “모르겠어요”로 넘겨도 됩니다.';return;}state.answers[state.index]={value,confidence};advance();};}
function advance(){if(state.index<questions.length-1){state.index++;persist();renderQuestion();}else{state.finished=true;persist();renderResults();}window.scrollTo({top:0,behavior:'smooth'});}
function parseNumber(value){const s=value.normalize('NFKC').replace(/[−–]/g,'-').replace(/\s/g,'');const n='[+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)';if(new RegExp('^'+n+'$').test(s)){const v=Number(s);return Number.isFinite(v)?v:null;}if(new RegExp('^'+n+'/'+n+'$').test(s)){const [a,b]=s.split('/').map(Number);return b!==0&&Number.isFinite(a/b)?a/b:null;}return null;}
function correct(q,a){if(!a||a.confidence==='skip')return false;return q.type==='number'?parseNumber(a.value)!==null&&Math.abs(parseNumber(a.value)-q.answer)<1e-9:a.value===String(q.answer);}
function analysis(){return domains.map(d=>{const ids=questions.map((q,i)=>q.d===d.id?i:-1).filter(i=>i>=0);const right=ids.filter(i=>correct(questions[i],state.answers[i])).length;const uncertain=ids.filter(i=>correct(questions[i],state.answers[i])&&state.answers[i].confidence==='unsure').length;const skipped=ids.filter(i=>!state.answers[i]||state.answers[i].confidence==='skip').length;const misconception=ids.filter(i=>!correct(questions[i],state.answers[i])&&state.answers[i]?.confidence==='sure').length;const level=right>=5&&right-uncertain>=4?'안정적':right>=4?'복습 권장':'기초 보강';return {...d,ids,right,uncertain,skipped,misconception,level};});}
function renderResults(){const stats=analysis(),total=stats.reduce((n,d)=>n+d.right,0),core=stats.slice(0,5),weak=core.filter(d=>d.right<4);let title,description;if(weak.length){title='먼저 채울 기초가 보여요';description=`${weak.map(d=>d.name).join(', ')}부터 연습하면 뒤의 설명을 따라가기 쉬워집니다. 점수가 낮아도 처음부터 전부 다시 할 필요는 없습니다.`;}else if(core.every(d=>d.level==='안정적')){title='선형방정식을 시작해 보세요';description='핵심 수학 영역에서 계산과 개념을 비교적 안정적으로 확인했습니다. Chapter 01을 읽으며 낯선 개념을 하나씩 확장해 보세요.';}else{title='복습과 함께 시작하면 좋아요';description='핵심 영역의 기본 답은 대체로 맞혔습니다. 틀렸거나 확신 없이 맞힌 개념을 먼저 확인한 뒤 Chapter 01을 시작해 보세요.';}if(stats[5].right<4)description+=' Python 코드를 직접 실행하기 전에는 함수와 Python 표기를 따로 보강하세요.';
const priorities=stats.filter(d=>d.level!=='안정적').sort((a,b)=>a.right-b.right||b.misconception-a.misconception);
app.innerHTML=`<span class="eyebrow">나의 기초 지식 리포트</span><h1 tabindex="-1" id="results-title">${title}</h1><div class="score">${total}<small> / ${questions.length}문제 정답</small></div><p class="muted">${esc(description)}</p><div class="note">각 분야 6문제 중 5개 이상 정답이고, 그중 4개 이상을 “알고 풀었어요”로 맞히면 안정적으로 표시합니다. 4개 이상 정답은 복습 권장, 그 미만은 기초 보강입니다. 전체 점수만으로 준비도를 판단하지 않습니다. 이 기준은 학습 안내용이며, 표준화된 능력 측정 기준은 아닙니다.</div><div class="section"><h2>어디가 익숙하고, 어디가 낯설까요?</h2>${stats.map(d=>`<div class="domain"><div class="row"><h3>${esc(d.name)}</h3><span class="pill">${d.level} · ${d.right}/6</span></div><div class="bar"><span style="width:${d.right/6*100}%"></span></div><p class="small muted">모르겠어요 ${d.skipped}개 · 확신 없이 맞힘 ${d.uncertain}개 · 확신했지만 틀림 ${d.misconception}개</p><p>${esc(d.tip)}</p><p class="small">다시 읽기: <a href="Basic_Knowledge.md" target="_blank" rel="noopener">Basic_Knowledge.md ${d.chapter}</a></p></div>`).join('')}</div><div class="section"><h2>추천하는 다음 학습 순서</h2>${priorities.length?`<ol>${priorities.map(d=>`<li><strong>${esc(d.name)}</strong> — 기초 문서 ${d.chapter}을 읽고, 아래 해당 문제를 해설 없이 다시 풀어 보세요.</li>`).join('')}</ol>`:'<p>Chapter 01의 예제를 직접 풀어 보세요. 답을 찾는 것과 함께, 왜 그렇게 계산했는지 한 문장으로 설명해 보세요.</p>'}<p class="small muted">같은 검사를 다시 풀면 답을 기억해서 점수가 오를 수 있습니다. 숫자를 바꾼 예제도 풀어 보고 이해했는지 확인하세요.</p></div><div class="section"><h2>문제별 답과 해설</h2><label class="small"><input type="checkbox" id="review-filter" checked> 틀렸거나 확신이 부족한 문제만 보기</label><div id="reviews"></div></div><div class="actions"><button id="restart">다시 풀기</button><button class="secondary" id="print">결과 인쇄 / PDF 저장</button></div>`;
function reviews(){const only=document.getElementById('review-filter').checked;const selected=questions.map((q,i)=>({q,i,a:state.answers[i]})).filter(({q,a})=>!only||!correct(q,a)||a?.confidence!=='sure');document.getElementById('reviews').innerHTML=selected.length?selected.map(({q,i,a})=>{const ok=correct(q,a);const response=!a||a.confidence==='skip'?'모르겠어요':q.type==='choice'?(q.options[Number(a.value)]??'미응답'):a.value;return `<details class="review"><summary>${i+1}. ${ok?'정답 · 확신 확인':'복습 필요'} — ${esc(q.text)}</summary>${q.formula?`<pre class="formula">${esc(q.formula)}</pre>`:''}<p>내 답: ${esc(response)}${a?.confidence==='sure'?' (알고 풀었어요)':a?.confidence==='unsure'?' (헷갈려요 / 추측했어요)':''}</p><p><strong>정답: ${esc(q.type==='choice'?q.options[q.answer]:q.answer)}</strong></p><p>${esc(q.explain)}</p><p class="muted">기초 문서 ${esc(q.chapter)}번</p></details>`;}).join(''):'<p class="muted">모든 문제를 확신 있게 맞혔어요. 체크를 해제하면 전체 해설을 볼 수 있습니다.</p>';}
reviews();document.getElementById('review-filter').onchange=reviews;document.getElementById('restart').onclick=()=>{if(confirm('현재 답을 지우고 다시 풀까요? 필요하면 먼저 결과를 인쇄해 주세요.'))fresh();};document.getElementById('print').onclick=()=>{document.querySelectorAll('details').forEach(d=>d.open=true);window.print();};document.getElementById('results-title').focus();}
intro();if(!storageOK)document.querySelector('.footer').textContent='서버 전송 없음 · 이 브라우저에서는 진행 상황 저장을 사용할 수 없어요';
</script>
</body>
</html>
